[project]
name = "krkr-gates"
version = "0.1.0"
description = "Unified gate checks for the krkr-rs workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
krkr-gate = "krkr_gates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krkr_gates"]
