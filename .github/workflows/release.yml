# Release build: one `v*` tag builds the Linux binary and the Android APK,
# then publishes both to the same GitHub Release.
#
# Triggers: **`v*` tags** and `workflow_dispatch`. A branch push triggers
# nothing: releases are metered, so a full Linux + Android build runs only when
# a release is deliberately tagged (or a maintainer starts a manual run).
#
# Pipeline: `linux` and `apk` run in parallel; `release` waits for both and is
# the only job that creates or uploads a GitHub Release, so the two platform jobs
# cannot race each other. The repository static gate is a local pre-tag check,
# not a release job: it is slow and repeats work these builds already compile.
#
# Scope of the Android build: `arm64-v8a` only, release build. No other ABIs,
# no emulator, no real signing key (the APK is signed with the debug key when
# no keystore secret is configured, so it installs — see docs.old/android.md
# §1).
#
# The commands mirror builds that were run by hand and verified end to end on a
# development machine; the orchestrations below are exercised by every `v*`
# tag and by manual runs.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The platform jobs only read the repository. The release job raises its own
# `contents: write` permission, which is where a token with write access is
# actually needed.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned exactly to what the port was verified against locally: NDK r27c
  # compiles the vendored C++ TJS2 VM, so a version bump changes the compiler
  # that builds the VM and must be re-verified.
  NDK_VERSION: '27.2.12479018'
  # The SDK platform carries a *minor* version — there is no plain
  # `platforms;android-37`.
  PLATFORM_VERSION: 'android-37.2'
  BUILD_TOOLS_VERSION: '37.0.0'
  # AGP picks these two for itself: with `compileSdk = 37` and no explicit
  # minor it resolves `platforms;android-37.0`, and with no `buildToolsVersion`
  # it uses AGP's own default revision (36.0.0). They were being fetched by
  # AGP's implicit SDK auto-download — the builds passed, but on a slow or
  # offline runner that download is a silent dependency, so install them here.
  # Both ids verified present in Google's repository index.
  AGP_PLATFORM_VERSION: 'android-37.0'
  AGP_BUILD_TOOLS_VERSION: '36.0.0'
  # Gradle 9.x, because AGP 9.4 requires it.
  GRADLE_VERSION: '9.7.1'
  # `crates/tjs/build.rs` runs `zig build` in `deps/` to fetch
  # fmt/spdlog/boost/oniguruma through the zig package manager; the NDK clang
  # does the actual cross-compiling, but zig is still required to fetch.
  ZIG_VERSION: '0.17.0'

jobs:
  linux:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The release build compiles the workspace, the C++ TJS2 VM and its
      # Zig-fetched dependencies.
      - name: Install the Linux build dependencies
        run: |
          # apt must not wait for an answer that never comes on a runner:
          # the frontend must not prompt, needrestart must not offer to
          # restart services (it does on Ubuntu 24.04 and later, and it
          # waits), and Dpkg::Use-Pty=0 keeps dpkg off a pty so it cannot
          # ask. `sudo` resets the environment, so the variables are
          # passed on the command line rather than in the step's env.
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 install -y --no-install-recommends \
            bison build-essential clang cmake libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libasound2-dev libc++-dev libc++abi-dev pkg-config python3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        run: |
          ZIG_DIR="$RUNNER_TEMP/zig"
          mkdir -p "$ZIG_DIR"
          curl -sSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      # Compile the C++ VM with the distribution's clang/libc++ pair. Zig's
      # bundled libc++ is newer than the runtime installed on the runner, and
      # the Rust link step uses the system runtime; using the matching compiler
      # here keeps headers and runtime in the same ABI.
      - name: Build the release binary
        env:
          CC: clang
          CXX: clang++ -stdlib=libc++
        run: cargo build --release -p app

      # The archive carries the run note, not just the executable: the binary
      # is dynamically linked against the system FFmpeg, ALSA, libc++/libc++abi
      # and the C library, so calling it a static build would be wrong.
      - name: Package the Linux binary
        run: |
          set -euo pipefail
          dist="krkr-rs-linux-x86_64"
          tarball="$dist.tar.gz"
          rm -rf "$dist" "$tarball"
          mkdir -p "$dist"
          cp target/release/krkr "$dist/krkr"
          cp LICENSE "$dist/LICENSE"
          cat > "$dist/README.txt" <<'EOF'
          krkr-rs Linux x86_64
          ====================

          Run:
            ./krkr --base-dir /path/to/game

          Headless smoke test:
            ./krkr --headless --frames 1000 --base-dir /path/to/game

          This is a dynamically linked build, not a static binary. It links the
          system FFmpeg runtime libraries, ALSA, libc++/libc++abi and the C
          library, and loads Vulkan, X11 and Wayland at run time. Install the
          distribution packages that provide them, for example on Debian/Ubuntu:

            libavcodec* libavformat* libavutil* libswscale* libswresample*
            libasound2 (or libasound2t64) libc++1 libc++abi1 libvulkan1

          The exact soname and package names follow the distribution release.
          The binary was built on GitHub's ubuntu-latest runner.
          EOF
          tar -C . -czf "$tarball" "$dist"
          tar -tzf "$tarball"

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: krkr-rs-linux-x86_64
          path: krkr-rs-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    # A build takes about seven minutes. The default is six hours, so a hung
    # step would bill for hours before failing; this fails fast instead.
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # `bison` generates the TJS2 parsers; `crates/tjs/build.rs` also
      # needs python3, which the runner image already provides.
      - name: Install build dependencies
        run: |
          # apt must not wait for an answer that never comes on a runner:
          # the frontend must not prompt, needrestart must not offer to
          # restart services (it does on Ubuntu 24.04 and later, and it
          # waits), and Dpkg::Use-Pty=0 keeps dpkg off a pty so it cannot
          # ask. `sudo` resets the environment, so the variables are
          # passed on the command line rather than in the step's env.
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 update
          # apt must not wait for an answer that never comes on a runner:
          # the frontend must not prompt, needrestart must not offer to
          # restart services (it does on Ubuntu 24.04 and later, and it
          # waits), and Dpkg::Use-Pty=0 keeps dpkg off a pty so it cannot
          # ask. `sudo` resets the environment, so the variables are
          # passed on the command line rather than in the step's env.
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 install -y --no-install-recommends bison

      # JDK 21, the current LTS: Gradle 9.x and AGP 9.x both support it.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # No `android-actions/setup-android` step: it installs the legacy `tools`
      # package, which no longer exists in Google's repository, so it fails with
      # "Failed to find package 'tools'". The runner image already ships an SDK
      # with a current `sdkmanager`, so this uses that directly and installs only
      # what is missing — which also makes the SDK root explicit rather than
      # implicit in the action's behaviour.
      - name: Install the NDK, platform and build-tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "ndk;$NDK_VERSION" "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;$AGP_PLATFORM_VERSION" "build-tools;$AGP_BUILD_TOOLS_VERSION"
          # `crates/android/build-android.sh` reads this to locate the toolchain,
          # and Gradle resolves `ndkVersion` under $SDK_ROOT/ndk, which
          # sdkmanager has just populated.
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The release signing key, base64-encoded in a secret so the keystore is
      # never in the repository. Written to $GITHUB_ENV, so it reaches the
      # Gradle step. Deliberately *not* an `if:` on the secret — the `secrets`
      # context is not available there — and the absence of the secret is a
      # normal case that the build handles (it falls back to the debug key).
      - name: Decode the release keystore (when a secret is configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KRKR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing the release APK with the configured keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; the release APK will be signed with the debug key."
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Zig is needed before the Rust build, not for compiling —
      # `crates/tjs/build.rs` fetches its C/C++ dependencies (fmt, spdlog,
      # boost, oniguruma) with `zig build` in `deps/`, and under the cross build
      # it is only a fetch: the NDK clang compiles everything. Pinned, and
      # fetched directly rather than through a third-party action, so there is
      # one less moving part that can break for unrelated reasons.
      - name: Install Zig
        run: |
          ZIG_DIR="$RUNNER_TEMP/zig"
          mkdir -p "$ZIG_DIR"
          curl -sSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      # Builds and stages libkrkr_android.so into the Gradle module's jniLibs.
      # The script owns every Android-specific detail (toolchain paths, the
      # triple-prefixed clang driver, the linker variable, ANDROID_NDK_HOME for
      # opusic-sys's cmake) so the engine crates stay platform-neutral — and it
      # verifies the .so really is arm64 before staging it, because a host
      # toolchain otherwise produces a silently wrong library.
      #
      # Note: deliberately *not* `cargo ndk`, which does not provide CXX in the
      # form crates/tjs/build.rs reads and therefore falls back to a host
      # compiler. See the header of the script.
      - name: Build the engine for arm64-v8a
        run: bash ./crates/android/build-android.sh --ndk "$ANDROID_NDK_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble the release APK
        working-directory: android
        env:
          # `KRKR_KEYSTORE_PATH` arrives via $GITHUB_ENV from the decode step
          # above; the rest come straight from the secrets. When any are absent
          # the Gradle build falls back to the debug key and still produces an
          # installable APK — see app/build.gradle.kts.
          KRKR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KRKR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KRKR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # The APK is the artifact that reaches a device, so it is the thing that
      # is checked: every native library it ships must have its dependencies
      # resolvable (the platform or another library of the package) and must be
      # loadable from the APK as it is. A library that needs a C++ runtime the
      # package does not carry fails on the device with "failed to dlopen
      # libc++_shared.so", long after the build went green.
      - name: Verify the packaged native libraries
        run: |
          # The self-test proves the check can still fail (an unresolvable
          # dependency, a private static libc, a misaligned library); the
          # second run checks the package that reaches the device.
          bash ./crates/android/check-jni-libs.sh --self-test
          bash ./crates/android/check-jni-libs.sh \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: krkr-rs-release-arm64-v8a
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # The only job that creates or uploads a GitHub Release. Waiting for both
  # platform jobs here means the release is assembled once, after both
  # artifacts exist; a manual run has no tag to hang a release on, so it stops
  # at the two artifacts.
  release:
    name: Publish the GitHub Release
    needs: [linux, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the Linux binary
        uses: actions/download-artifact@v4
        with:
          name: krkr-rs-linux-x86_64
          path: dist/linux

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: krkr-rs-release-arm64-v8a
          path: dist/android

      # `gh` rather than a third-party release action: fewer moving parts, and
      # the token is already in the environment. Re-running a tag build must not
      # fail on an existing release, so an existing one is updated in place.
      - name: Publish both artifacts as one GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          linux=dist/linux/krkr-rs-linux-x86_64.tar.gz
          apk="$(find dist/android -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "error: no APK under dist/android; the Android job produced no artifact" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$linux" "$apk" --clobber
          else
            gh release create "$tag" "$linux" "$apk" \
              --title "krkr-rs $tag" \
              --notes "Linux x86_64 binary and Android APK (arm64-v8a, Android 15+) built from $GITHUB_SHA." \
              --verify-tag
          fi
