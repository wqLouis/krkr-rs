# Linux CI for the new architecture.
#
# Compiling the whole workspace needs the gitignored `reference/` krkr2
# checkout (see `crates/tjs/build.rs`), so this job runs the checks that
# need no external checkout: formatting and the D9 stateless guard. A full
# clippy/test job can be added once the reference checkout is available to CI.
name: CI

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: fmt · D9 guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      # D9: the bottom core (L1) has no globals/caches/hidden state. The script
      # covers api/fs/media/render and platform.
      - name: D9 stateless guard
        run: bash scripts/check-stateless.sh
