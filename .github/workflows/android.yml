# Android APK build for the experimental Android target (see docs/android.md).
#
# Triggers are deliberately narrow: this runs **only** on the dedicated
# `android` branch and on tags, never on the default branch. The Android port is
# an experiment, so nothing here should fire while ordinary engine work is going
# on. Create/ push the `android` branch (or push a tag) to build it; the manual
# `workflow_dispatch` entry is there for ad-hoc runs.
#
# Scope: `arm64-v8a` only, release build. No other ABIs, no emulator, no real
# signing key (the APK is signed with the debug key so it installs — see
# docs/android.md §1).
#
# The commands here mirror a build that was run by hand and verified end to end
# on a development machine (94 MB APK from a 71 MB engine .so). The workflow
# itself has never been triggered, so treat the orchestration as unproven while
the commands inside it are known-good.
name: Android

on:
  push:
    branches:
      - android
    tags:
      # Tagging is deliberate, so a tag anywhere triggers a build. Note that
      # `v*` therefore fires on the default branch too; tag a release only when
      # the Android port is in a state worth building.
      - 'v*'
      - 'android-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned exactly to what the port was verified against locally: NDK r27c
  # compiles the vendored C++ TJS2 VM, so a version bump changes the compiler
  # that builds the VM and must be re-verified.
  NDK_VERSION: '27.2.12479018'
  # The SDK platform carries a *minor* version — there is no plain
  # `platforms;android-37`.
  PLATFORM_VERSION: 'android-37.2'
  BUILD_TOOLS_VERSION: '37.0.0'
  # Gradle 9.x, because AGP 9.4 requires it.
  GRADLE_VERSION: '9.7.1'

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `bison` generates the TJS2 parsers; `crates/tjs2-sys/build.rs` also
      # needs python3, which the runner image already provides.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, platform and build-tools
        run: |
          yes | sdkmanager --install "ndk;$NDK_VERSION"
          yes | sdkmanager --install "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION"
          # `crates/android/build-android.sh` reads this to locate the toolchain,
          # and Gradle resolves `ndkVersion` under $ANDROID_SDK_ROOT/ndk, which
          # sdkmanager has just populated.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      # Builds and stages libkrkr_android.so into the Gradle module's jniLibs.
      # The script owns every Android-specific detail (toolchain paths, the
      # triple-prefixed clang driver, the linker variable, ANDROID_NDK_HOME for
      # opusic-sys's cmake) so the engine crates stay platform-neutral — and it
      # verifies the .so really is arm64 before staging it, because a host
      # toolchain otherwise produces a silently wrong library.
      #
      # Note: deliberately *not* `cargo ndk`, which does not provide CXX in the
      # form crates/tjs2-sys/build.rs reads and therefore falls back to a host
      # compiler. See the header of the script.
      - name: Build the engine for arm64-v8a
        run: ./crates/android/build-android.sh --ndk "$ANDROID_NDK_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble the release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: krkr-rs-release-arm64-v8a
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
