# Android APK build for the experimental Android target (see docs/android.md).
#
# Triggers are deliberately narrow: this runs **only** on the dedicated
# `android` branch and on tags, never on the default branch. The Android port is
# an experiment, so nothing here should fire while ordinary engine work is going
# on. Create/ push the `android` branch (or push a tag) to build it; the manual
# `workflow_dispatch` entry is there for ad-hoc runs.
#
# Scope: `arm64-v8a` only, release build. No other ABIs, no emulator, no real
# signing key (the APK is signed with the debug key so it installs — see
# docs/android.md §1).
#
# The commands here mirror a build that was run by hand and verified end to end
# on a development machine (94 MB APK from a 71 MB engine .so). The workflow
# itself has never been triggered, so treat the orchestration as unproven while
# the commands inside it are known-good.
name: Android

on:
  push:
    branches:
      - android
    tags:
      # Tagging is deliberate, so a tag anywhere triggers a build. Note that
      # `v*` therefore fires on the default branch too; tag a release only when
      # the Android port is in a state worth building.
      - 'v*'
      - 'android-*'
  workflow_dispatch:

permissions:
  # `contents: write` is needed to publish the APK to a GitHub Release when the
  # run was triggered by a tag. The default is read-only, which would make the
  # release step fail with a confusing 403.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned exactly to what the port was verified against locally: NDK r27c
  # compiles the vendored C++ TJS2 VM, so a version bump changes the compiler
  # that builds the VM and must be re-verified.
  NDK_VERSION: '27.2.12479018'
  # The SDK platform carries a *minor* version — there is no plain
  # `platforms;android-37`.
  PLATFORM_VERSION: 'android-37.2'
  BUILD_TOOLS_VERSION: '37.0.0'
  # Gradle 9.x, because AGP 9.4 requires it.
  GRADLE_VERSION: '9.7.1'

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `bison` generates the TJS2 parsers; `crates/tjs2-sys/build.rs` also
      # needs python3, which the runner image already provides.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, platform and build-tools
        run: |
          yes | sdkmanager --install "ndk;$NDK_VERSION"
          yes | sdkmanager --install "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION"
          # `crates/android/build-android.sh` reads this to locate the toolchain,
          # and Gradle resolves `ndkVersion` under $ANDROID_SDK_ROOT/ndk, which
          # sdkmanager has just populated.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The release signing key, base64-encoded in a secret so the keystore is
      # never in the repository. Written to $GITHUB_ENV, so it reaches the
      # Gradle step. Deliberately *not* an `if:` on the secret — the `secrets`
      # context is not available there — and the absence of the secret is a
      # normal case that the build handles (it falls back to the debug key).
      - name: Decode the release keystore (when a secret is configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KRKR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing the release APK with the configured keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; the release APK will be signed with the debug key."
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      # Builds and stages libkrkr_android.so into the Gradle module's jniLibs.
      # The script owns every Android-specific detail (toolchain paths, the
      # triple-prefixed clang driver, the linker variable, ANDROID_NDK_HOME for
      # opusic-sys's cmake) so the engine crates stay platform-neutral — and it
      # verifies the .so really is arm64 before staging it, because a host
      # toolchain otherwise produces a silently wrong library.
      #
      # Note: deliberately *not* `cargo ndk`, which does not provide CXX in the
      # form crates/tjs2-sys/build.rs reads and therefore falls back to a host
      # compiler. See the header of the script.
      - name: Build the engine for arm64-v8a
        run: ./crates/android/build-android.sh --ndk "$ANDROID_NDK_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble the release APK
        working-directory: android
        env:
          # `KRKR_KEYSTORE_PATH` arrives via $GITHUB_ENV from the decode step
          # above; the rest come straight from the secrets. When any are absent
          # the Gradle build falls back to the debug key and still produces an
          # installable APK — see app/build.gradle.kts.
          KRKR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KRKR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KRKR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: krkr-rs-release-arm64-v8a
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # A tag run also becomes a GitHub Release, with the APK attached — an
      # artifact is only reachable from the run that produced it, whereas the
      # release is where someone who just wants the app will look. A branch run
      # has no tag to hang a release on, so it stops at the artifact.
      #
      # `gh` rather than a third-party release action: fewer moving parts, and
      # the token is already in the environment.
      - name: Publish the APK as a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk=android/app/build/outputs/apk/release/app-release.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running a tag build must not fail on an existing release.
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "krkr-rs $tag" \
              --notes "Android build (arm64-v8a, Android 15+) from \`$GITHUB_SHA\`." \
              --verify-tag
          fi
