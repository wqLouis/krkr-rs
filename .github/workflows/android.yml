# Android APK build for the experimental Android target (see docs/android.md).
#
# Triggers: **`android-*` tags**. The tag name carries the branch, so the
# filter does the whole job natively — no gate job, no ancestry check:
#
#   * a `v*` tag (an engine release on `main`) does not match, so it cannot
#     start an Android build;
#   * an `android-*` tag is only ever created on the `android` branch, which is
#     the convention this trigger relies on;
#   * pushing the branch builds nothing — only tagging does.
#
# That is "tagged AND android" expressed in one line, where combining
# `branches:` with `tags:` could only ever express OR.
#
# `workflow_dispatch` is retained for ad-hoc runs and is not filtered: it is
# manual, and whoever triggers it has already decided.
#
# Scope: `arm64-v8a` only, release build. No other ABIs, no emulator, no real
# signing key (the APK is signed with the debug key so it installs — see
# docs/android.md §1).
#
# The commands here mirror a build that was run by hand and verified end to end
# on a development machine (94 MB APK from a 71 MB engine .so). The workflow
# itself has never been triggered, so treat the orchestration as unproven while
# the commands inside it are known-good.
name: Android

on:
  push:
    tags:
      # Only Android tags. `v*` is deliberately absent: those are engine
      # releases tagged on `main`, and matching them would build an APK for
      # every one of them.
      - 'android-*'
  workflow_dispatch:

permissions:
  # `contents: write` is needed to publish the APK to a GitHub Release when the
  # run was triggered by a tag. The default is read-only, which would make the
  # release step fail with a confusing 403.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned exactly to what the port was verified against locally: NDK r27c
  # compiles the vendored C++ TJS2 VM, so a version bump changes the compiler
  # that builds the VM and must be re-verified.
  NDK_VERSION: '27.2.12479018'
  # The SDK platform carries a *minor* version — there is no plain
  # `platforms;android-37`.
  PLATFORM_VERSION: 'android-37.2'
  BUILD_TOOLS_VERSION: '37.0.0'
  # AGP picks these two for itself: with `compileSdk = 37` and no explicit
  # minor it resolves `platforms;android-37.0`, and with no `buildToolsVersion`
  # it uses AGP's own default revision (36.0.0). They were being fetched by
  # AGP's implicit SDK auto-download — the builds passed, but on a slow or
  # offline runner that download is a silent dependency, so install them here.
  # Both ids verified present in Google's repository index.
  AGP_PLATFORM_VERSION: 'android-37.0'
  AGP_BUILD_TOOLS_VERSION: '36.0.0'
  # Gradle 9.x, because AGP 9.4 requires it.
  GRADLE_VERSION: '9.7.1'
  # `crates/tjs2-sys/build.rs` runs `zig build` in `deps/` to fetch
  # fmt/spdlog/boost/oniguruma through the zig package manager; the NDK clang
  # does the actual cross-compiling, but zig is still required to fetch.
  ZIG_VERSION: '0.16.0'

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `bison` generates the TJS2 parsers; `crates/tjs2-sys/build.rs` also
      # needs python3, which the runner image already provides.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No `android-actions/setup-android` step: it installs the legacy `tools`
      # package, which no longer exists in Google's repository, so it fails with
      # "Failed to find package 'tools'". The runner image already ships an SDK
      # with a current `sdkmanager`, so this uses that directly and installs only
      # what is missing — which also makes the SDK root explicit rather than
      # implicit in the action's behaviour.
      - name: Install the NDK, platform and build-tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "ndk;$NDK_VERSION" "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;$AGP_PLATFORM_VERSION" "build-tools;$AGP_BUILD_TOOLS_VERSION"
          # `crates/android/build-android.sh` reads this to locate the toolchain,
          # and Gradle resolves `ndkVersion` under $SDK_ROOT/ndk, which
          # sdkmanager has just populated.
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The release signing key, base64-encoded in a secret so the keystore is
      # never in the repository. Written to $GITHUB_ENV, so it reaches the
      # Gradle step. Deliberately *not* an `if:` on the secret — the `secrets`
      # context is not available there — and the absence of the secret is a
      # normal case that the build handles (it falls back to the debug key).
      - name: Decode the release keystore (when a secret is configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KRKR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing the release APK with the configured keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; the release APK will be signed with the debug key."
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Zig is needed before the Rust build, not for compiling —
      # `crates/tjs2-sys/build.rs` fetches its C/C++ dependencies (fmt, spdlog,
      # boost, oniguruma) with `zig build` in `deps/`, and under the cross build
      # it is only a fetch: the NDK clang compiles everything. Pinned, and
      # fetched directly rather than through a third-party action, so there is
      # one less moving part that can break for unrelated reasons.
      - name: Install Zig
        run: |
          ZIG_DIR="$RUNNER_TEMP/zig"
          mkdir -p "$ZIG_DIR"
          curl -sSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      # Builds and stages libkrkr_android.so into the Gradle module's jniLibs.
      # The script owns every Android-specific detail (toolchain paths, the
      # triple-prefixed clang driver, the linker variable, ANDROID_NDK_HOME for
      # opusic-sys's cmake) so the engine crates stay platform-neutral — and it
      # verifies the .so really is arm64 before staging it, because a host
      # toolchain otherwise produces a silently wrong library.
      #
      # Note: deliberately *not* `cargo ndk`, which does not provide CXX in the
      # form crates/tjs2-sys/build.rs reads and therefore falls back to a host
      # compiler. See the header of the script.
      - name: Build the engine for arm64-v8a
        run: bash ./crates/android/build-android.sh --ndk "$ANDROID_NDK_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble the release APK
        working-directory: android
        env:
          # `KRKR_KEYSTORE_PATH` arrives via $GITHUB_ENV from the decode step
          # above; the rest come straight from the secrets. When any are absent
          # the Gradle build falls back to the debug key and still produces an
          # installable APK — see app/build.gradle.kts.
          KRKR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KRKR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KRKR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: krkr-rs-release-arm64-v8a
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # A tag run also becomes a GitHub Release, with the APK attached — an
      # artifact is only reachable from the run that produced it, whereas the
      # release is where someone who just wants the app will look. A branch run
      # has no tag to hang a release on, so it stops at the artifact.
      #
      # `gh` rather than a third-party release action: fewer moving parts, and
      # the token is already in the environment.
      - name: Publish the APK as a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk=android/app/build/outputs/apk/release/app-release.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running a tag build must not fail on an existing release.
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "krkr-rs $tag" \
              --notes "Android build (arm64-v8a, Android 15+) from \`$GITHUB_SHA\`." \
              --verify-tag
          fi
