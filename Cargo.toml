[workspace]
resolver = "2"
members = [
    # The C++ TJS2 VM — the compatibility anchor and the only legacy crate
    # the new architecture still links.
    "crates/tjs",
    # new architecture (D9/D10)
    "crates/api",
    "crates/fs",
    "crates/media",
    "crates/render",
    "crates/engine",
    "crates/platform",
    "crates/compat",
    "crates/vm",
    "crates/app",
    # dev-only shared test helper (not part of the runtime architecture)
    "crates/testkit",
]
default-members = ["crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
tjs = { path = "crates/tjs" }
api = { path = "crates/api" }
fs = { path = "crates/fs" }
media = { path = "crates/media" }
render = { path = "crates/render" }
engine = { path = "crates/engine" }
platform = { path = "crates/platform" }
compat = { path = "crates/compat" }
vm = { path = "crates/vm" }
# dev-only test helper; consumed through [dev-dependencies] only
testkit = { path = "crates/testkit" }
cosmic-text = { version = "0.19", default-features = false, features = ["std"] }
thiserror = "2"
log = "0.4"
ash = "0.38"
raw-window-handle = "0.6"
winit = "0.30"
flate2 = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
