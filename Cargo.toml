[workspace]
resolver = "2"
members = [
    # legacy compatibility anchors + algorithm sources (migrated from)
    "crates/xp3",
    "crates/tjs2-sys",
    "crates/engine",
    "crates/kag",
    "crates/tvp-util",
    "crates/tvp-streams",
    "crates/tvp-natives",
    "crates/tvp-storages",
    "crates/tvp-scripts",
    "crates/tvp-config",
    "crates/tvp-visual",
    "crates/tvp-text",
    "crates/tvp-kagparser",
    "crates/tvp-input",
    "crates/tvp-sound",
    # new architecture (D9/D10)
    "crates/krkr-api",
    "crates/krkr-fs",
    "crates/krkr-media",
    "crates/krkr-render",
    "crates/krkr-engine",
    "crates/krkr-platform",
    "crates/krkr-compat",
    "crates/krkr-vm",
    "crates/krkr-app",
]
default-members = ["crates/krkr-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
xp3 = { path = "crates/xp3" }
tjs2-sys = { path = "crates/tjs2-sys" }
krkr-api = { path = "crates/krkr-api" }
krkr-fs = { path = "crates/krkr-fs" }
krkr-media = { path = "crates/krkr-media" }
krkr-render = { path = "crates/krkr-render" }
krkr-engine = { path = "crates/krkr-engine" }
krkr-platform = { path = "crates/krkr-platform" }
krkr-compat = { path = "crates/krkr-compat" }
krkr-vm = { path = "crates/krkr-vm" }
thiserror = "2"
log = "0.4"
ash = "0.38"
raw-window-handle = "0.6"
winit = "0.30"
flate2 = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
