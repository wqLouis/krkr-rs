[package]
name = "media"
description = "krkr-rs stateless media backend: image/audio/video decode (ffmpeg | mediacodec)"
version.workspace = true
edition.workspace = true
license.workspace = true
# The PSB/PSD format reader is its own workspace member inside this directory;
# keep it out of this package's file list.
exclude = ["psd"]

[features]
# D13: exactly one video backend is selected at compile time. The default is
# the desktop FFmpeg backend. An Android frontend must turn the default off and
# select the stub instead:
#
#     media = { path = "../platform/media", default-features = false, features = ["video-mediacodec"] }
#
# A member cannot spell this as `workspace = true, default-features = false`:
# edition 2024 forbids a member from overriding the workspace dependency's
# `default-features`, so the Android consumer names the path directly.
#
# Selecting neither (or both) is a hard `compile_error!` in src/video/mod.rs.
default = ["video-ffmpeg"]
# Linux/desktop: system FFmpeg via `ffmpeg-next` (linked dynamically, D5).
video-ffmpeg = ["dep:ffmpeg-next"]
# Android: NDK MediaCodec backend. Uses the maintained `ndk` crate for the
# codec/format work plus a small raw `AMediaExtractor` shim (`libmediandk`);
# links no FFmpeg. On non-Android targets a typed `Unsupported` stub keeps
# host `cargo check` green (the `ndk` dependency is target-gated below).
video-mediacodec = []

[dependencies]
api = { workspace = true }
# Optional so the Android build never links libav*. Enabled by `video-ffmpeg`.
ffmpeg-next = { workspace = true, optional = true }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3", "isomp4", "aac"] }
symphonia-adapter-libopus = "0.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
    "tga",
    "dds",
    "pnm",
    "ico",
    "qoi",
    "hdr",
    "exr",
    "ff",
] }

# Android-only: safe NDK MediaCodec/MediaFormat bindings. `ndk` selects the
# `ndk-sys` `media` feature and links `libmediandk`; it is not in the host
# dependency graph, so `cargo check` on Linux never needs the Android NDK.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media"] }

[dev-dependencies]
testkit = { workspace = true }
