[package]
name = "tvp-natives"
description = "TVP native classes implemented in Rust: System, Debug (methods-first wave)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tjs2-sys = { workspace = true }
engine = { path = "../engine" }
tvp-input = { path = "../tvp-input" }
log = "0.4"
ffmpeg-next = { version = "9.0.0", optional = true }

[features]
default = ["ffmpeg"]
# System FFmpeg decoding for the VideoOverlay movie path. Disable with
# `--no-default-features` on targets without FFmpeg (e.g. Android).
ffmpeg = ["dep:ffmpeg-next"]
