[package]
name = "tvp-sound"
description = "TVP sound: decode + clock-driven mixer + SoundBuffer/SoundChannel native classes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tjs2-sys = { workspace = true }
engine = { path = "../engine" }
log = "0.4"
thiserror = "2"

# rodio = "0.20" for playback output (see src/player.rs). rodio 0.20 decodes
# with symphonia; we also depend on symphonia directly (same 0.5 series, so
# Cargo unifies them) because its API is a much better fit for headless
# decode-to-memory than rodio's Decoder, which is tied to device streams.
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3"] }
symphonia-adapter-libopus = "0.3"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-wav", "symphonia-vorbis", "symphonia-flac", "symphonia-mp3"] }
