[package]
name = "tvp-visual"
description = "TVP visual native classes (Window/Layer/Bitmap/Font/Timer) + logical scene model — no Bevy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tjs2-sys = { workspace = true }
engine = { path = "../engine" }
tvp-text = { path = "../tvp-text" }
flate2 = "1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
    "tga",
    "dds",
    "pnm",
    "ico",
    "qoi",
    "hdr",
    "exr",
    "ff",
] }
log = "0.4"
tempfile = "3"
thiserror = "2"
