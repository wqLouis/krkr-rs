[package]
name = "krkr-compat"
description = "krkr-rs L3 KiriKiri compatibility surface: native classes + KAG + event adapter + static plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krkr-engine = { workspace = true }
tjs2-sys = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# D13: `krkr-platform` has no default platform feature, so each target selects
# exactly one. L3 uses only the platform-agnostic event types; it still needs a
# backend feature to compile the L1 crate.
[target.'cfg(target_os = "linux")'.dependencies]
krkr-platform = { workspace = true, features = ["platform-linux"] }

[target.'cfg(target_os = "android")'.dependencies]
krkr-platform = { workspace = true, features = ["platform-android"] }
