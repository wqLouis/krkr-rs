[package]
name = "krkr-platform"
description = "krkr-rs L1 platform core: window/surface, event loop, input, clock, threads (all platform-specific code)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krkr-api = { workspace = true }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
winit = { workspace = true, optional = true }

[features]
default = ["platform-linux"]
# Exactly one platform feature must be active (D13). `platform-linux` compiles
# the real winit 0.30 backend; `platform-android` is a stub for now.
platform-linux = ["dep:winit"]
platform-android = []
