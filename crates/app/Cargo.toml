[package]
name = "app"
description = "krkr-rs host: L2 engine host + L1 render assembly (platform loop in platform)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krkr"
path = "src/main.rs"

[dependencies]
api = { workspace = true }
engine = { workspace = true }
render = { workspace = true }
fs = { workspace = true }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# The composition root owns the process logger (`RUST_LOG`, default `info`).
env_logger = { workspace = true }
# The composition root installs the L3 compat host seams (image codec, etc.).
compat = { workspace = true }
# The composition root also drives the L4 VM host (boot + frame body).
vm = { workspace = true }

# The window/audio and video backends are selected per target so a desktop
# backend can never leak into an Android build (and vice versa). `platform`
# has no default feature; `media` defaults to FFmpeg on the desktop and the
# Android build turns that default off for MediaCodec.
[target.'cfg(not(target_os = "android"))'.dependencies]
platform = { workspace = true, features = ["platform-linux"] }
media = { workspace = true, features = ["video-ffmpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
platform = { workspace = true, features = ["platform-android"] }
# Named by path rather than `workspace = true`: edition 2024 forbids a member
# from turning off default features inherited from the workspace, and the
# Android arm must drop FFmpeg for MediaCodec.
media = { path = "../platform/media", default-features = false, features = ["video-mediacodec"] }

[dev-dependencies]
tjs = { workspace = true }
