[package]
name = "krkr-app"
description = "krkr-rs CLI + native wiring: registers TVP native classes, loads games"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krkr-cli"
path = "src/main.rs"

# Diagnostic harness (TODO Stage 3.1): drives the game's timer/sound poll
# loop headlessly (no Bevy needed) and probes the VM state every second,
# to debug the logo→title ATTENTION transition.
[[bin]]
name = "attention-harness"
path = "src/bin/attention_harness.rs"

[dependencies]
engine = { path = "../engine" }
tjs2-sys = { workspace = true }
tvp-natives = { path = "../tvp-natives" }
tvp-storages = { path = "../tvp-storages" }
tvp-kagparser = { path = "../tvp-kagparser" }
tvp-scripts = { path = "../tvp-scripts" }
tvp-visual = { path = "../tvp-visual" }
tvp-sound = { path = "../tvp-sound" }
log = "0.4"
