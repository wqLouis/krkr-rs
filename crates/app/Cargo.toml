[package]
name = "app"
description = "krkr-rs host: L2 engine host + L1 render assembly (platform loop in platform)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krkr"
path = "src/main.rs"

[dependencies]
api = { workspace = true }
engine = { workspace = true }
# D13: select the platform explicitly; platform has no default feature.
# The desktop binary builds the Linux backend. An Android frontend must depend
# on `platform` with `features = ["platform-android"]` instead.
platform = { workspace = true, features = ["platform-linux"] }
render = { workspace = true }
fs = { workspace = true }
# D13: the desktop binary selects the FFmpeg video backend explicitly rather
# than relying on `media`'s default, so the Android frontend's
# `default-features = false, features = ["video-mediacodec"]` counterpart is
# documented at the call site too.
media = { workspace = true, features = ["video-ffmpeg"] }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# The composition root owns the process logger (`RUST_LOG`, default `info`).
env_logger = { workspace = true }
# The composition root installs the L3 compat host seams (image codec, etc.).
compat = { workspace = true }
# The composition root also drives the L4 VM host (boot + frame body).
vm = { workspace = true }

[dev-dependencies]
tjs = { workspace = true }
