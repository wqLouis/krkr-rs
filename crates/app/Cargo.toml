[package]
name = "krkr-app"
description = "krkr-rs CLI + native wiring: registers TVP native classes, loads games"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krkr-cli"
path = "src/main.rs"

[features]
default = ["ffmpeg"]
# Pass-through so `--no-default-features` also drops the tvp-natives FFmpeg
# movie decoder (e.g. Android).
ffmpeg = ["tvp-natives/ffmpeg"]

[dependencies]
engine = { path = "../engine" }
tjs2-sys = { workspace = true }
tvp-natives = { path = "../tvp-natives", default-features = false }
tvp-input = { path = "../tvp-input" }
tvp-storages = { path = "../tvp-storages" }
tvp-kagparser = { path = "../tvp-kagparser" }
tvp-scripts = { path = "../tvp-scripts" }
tvp-visual = { path = "../tvp-visual" }
tvp-sound = { path = "../tvp-sound" }
log = "0.4"
