[package]
name = "engine"
description = "krkr-rs middle layer: TVP layer system state + RenderScene projection + mixer + storage namespace"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Opt-in experiment: SIMD source-over rows. The app enables it by default;
# build the app with --no-default-features for the scalar A/B arm.
simd-experiment = ["dep:fearless_simd"]

[dependencies]
api = { workspace = true }
fs = { workspace = true }
render = { workspace = true }
cosmic-text = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true, features = ["std"] }
ahash = { workspace = true }
hashbrown = { workspace = true }
# Runtime-dispatched SIMD for the optional source-over row experiment.
fearless_simd = { version = "1.1.0", optional = true }

[dev-dependencies]
testkit = { workspace = true }
raw-window-handle = { workspace = true }
