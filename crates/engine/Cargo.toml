[package]
name = "engine"
description = "krkr-rs load module: mount game storages, bootstrap the TJS2 VM, run startup.tjs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xp3 = { workspace = true }
tjs2-sys = { workspace = true }
kag = { path = "../kag" }
tvp-util = { path = "../tvp-util" }
tvp-streams = { path = "../tvp-streams" }
log = "0.4"
thiserror = "2"

# Android has no usable stderr: route logging to logcat instead. Scoped to
# the target so the desktop build stays exactly as it was (stderr only) and
# does not compile a JNI/logcat dependency.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
