[package]
name = "vm"
description = "krkr-rs L4 TJS VM host over tjs: lifecycle, bytecode, GC roots, frame body"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
compat = { workspace = true }
# The lexer's operator table is matched by a generated scanner: the table is
# the longest match over the text at the cursor, so the patterns live in one
# place instead of in a chain of comparisons. The crate is pure Rust and its
# only other dependency is a procedural macro, so it adds no native library
# to the build and nothing to the Android target.
logos = "0.14"
tjs = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true, features = ["std"] }

# D13: `platform` has no default platform feature; select exactly one per
# target (L4 consumes only the platform-agnostic event types).
[target.'cfg(target_os = "linux")'.dependencies]
platform = { workspace = true, features = ["platform-linux"] }

[target.'cfg(target_os = "android")'.dependencies]
platform = { workspace = true, features = ["platform-android"] }

[dev-dependencies]
testkit = { workspace = true }
# The frame body the VM host runs reads the L2 frame clock (the compat layer's
# housekeeping intervals are measured against it), so the test harness has to
# create one. The crate's own code does not depend on the engine: this edge
# exists for the integration test only.
engine = { workspace = true }
