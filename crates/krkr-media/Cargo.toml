[package]
name = "krkr-media"
description = "krkr-rs stateless media backend: image/audio/video decode (ffmpeg | mediacodec)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krkr-api = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
flate2 = { workspace = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
    "tga",
    "dds",
    "pnm",
    "ico",
    "qoi",
    "hdr",
    "exr",
    "ff",
] }
