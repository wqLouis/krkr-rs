[package]
name = "krkr-media"
description = "krkr-rs stateless media backend: image/audio/video decode (ffmpeg | mediacodec)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krkr-api = { workspace = true }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3"] }
symphonia-adapter-libopus = "0.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
    "tga",
    "dds",
    "pnm",
    "ico",
    "qoi",
    "hdr",
    "exr",
    "ff",
] }
